name: Update IPTV Playlist

on:
  schedule:
    - cron: "0 18 * * *"   # 01:00 AM ICT daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run IPTV updater
        run: python update_livetv.py

      - name: Commit & push if updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add LiveTV.m3u
          git diff --cached --quiet || git commit -m "Auto-update LiveTV.m3u [$(date +'%Y-%m-%d')]"
          git push
